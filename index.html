<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>骄杉99</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            overflow: hidden;
        }
        body {
            background: black;
            height: 100vh;
            width: 100vw;
            position: relative;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #0a0a0a;
        }
        /* 底部鸣谢样式，字体缩小版 */
        .credits {
            position: fixed;
            bottom: 8px;
            left: 0;
            right: 0;
            text-align: center;
            font-family: "Microsoft YaHei", "PingFang SC", "SimHei", sans-serif;
            font-size: 10px;
            color: rgba(255, 255, 255, 0.6);
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            padding: 4px 10px;
            border-radius: 16px;
            width: fit-content;
            margin: 0 auto;
            pointer-events: none;
            z-index: 10;
            letter-spacing: 0.5px;
            font-weight: 400;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <canvas id="myCanvas"></canvas>
    <div class="credits">
        特别鸣谢：DeepSeek，GitHub<br>
        By:Eric
    </div>
    <script>
        (function() {
            const canvas = document.getElementById('myCanvas');
            const ctx = canvas.getContext('2d');

            // 要显示的文本
            const text = '骄杉99';

            let particles = [];

            // 增加跳动数量：从30提升到55，更饱满但保持可读性
            const PARTICLE_COUNT = 55;

            let time = 0;
            const SPEED_FACTOR = 0.02;

            function initParticles(width, height) {
                particles = [];
                for (let i = 0; i < PARTICLE_COUNT; i++) {
                    const baseX = 20 + Math.random() * (width - 40);
                    const baseY = 20 + Math.random() * (height - 40);
                    // 稍微缩小字体范围上限，避免过于拥挤时大字重叠严重 (20px ~ 52px)
                    const fontSize = 20 + Math.floor(Math.random() * 33);
                    const hue = Math.floor(Math.random() * 360);
                    const color = `hsl(${hue}, 85%, 60%)`;
                    const ampX = 8 + Math.random() * 28;
                    const ampY = 12 + Math.random() * 32;
                    const freqX = 0.4 + Math.random() * 1.6;
                    const freqY = 0.4 + Math.random() * 1.6;
                    const phaseX = Math.random() * Math.PI * 2;
                    const phaseY = Math.random() * Math.PI * 2;

                    particles.push({
                        baseX, baseY,
                        fontSize,
                        color,
                        ampX, ampY,
                        freqX, freqY,
                        phaseX, phaseY
                    });
                }
            }

            function resizeCanvas() {
                const w = window.innerWidth;
                const h = window.innerHeight;
                canvas.width = w;
                canvas.height = h;
                initParticles(w, h);
            }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            function draw() {
                time += SPEED_FACTOR;
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                for (let p of particles) {
                    const offsetX = p.ampX * Math.sin(time * p.freqX + p.phaseX);
                    const offsetY = p.ampY * Math.cos(time * p.freqY + p.phaseY);
                    const x = p.baseX + offsetX;
                    const y = p.baseY + offsetY;

                    ctx.font = `bold ${p.fontSize}px "Microsoft YaHei", "PingFang SC", "SimHei", sans-serif`;
                    ctx.fillStyle = p.color;
                    ctx.shadowColor = 'rgba(255,255,255,0.25)';
                    ctx.shadowBlur = 6;
                    ctx.shadowOffsetX = 1;
                    ctx.shadowOffsetY = 1;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(text, x, y);
                }

                requestAnimationFrame(draw);
            }

            draw();
        })();
    </script>
</body>
</html>
